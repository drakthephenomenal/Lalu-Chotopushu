name: Build Play AAB + full APK (all audio and video bundled)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free up disk space (media is several GB and gets copied a few times)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost \
                      /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4
        with:
          lfs: true   # harmless if the repo does not use Git LFS; needed if audio/video are LFS files

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # release.keystore / keystore.properties are in .gitignore, so a fresh checkout does not have
      # them. Provide them as repository secrets (Settings > Secrets and variables > Actions):
      #   KEYSTORE_BASE64   = output of:  base64 -w0 release.keystore
      #   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Install signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n' \
              "$KEYSTORE_PASSWORD" "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" "$KEY_ALIAS" > keystore.properties
            echo "Signing key installed from secrets."
          fi
          if [ ! -f release.keystore ] || [ ! -f keystore.properties ]; then
            echo "::error::No signing key. Add the repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (see comment in this workflow)."
            exit 1
          fi

      - name: Check the version counter file is clean
        run: |
          if ! grep -qE '^[0-9]+$' .app-version; then
            echo "::error::.app-version must contain just a number, but contains:"; cat .app-version; exit 1
          fi
          if grep -rIlE '^(<<<<<<<|>>>>>>>) ' --include=*.js --include=*.html --include=*.json --include=*.sh --include=.app-version . 2>/dev/null | grep -v node_modules; then
            echo "::error::Leftover git merge-conflict markers in the files listed above - resolve them first."; exit 1
          fi

      - run: npm install

      - name: Build AAB + full APK
        run: bash build-play-full.sh

      - name: Upload AAB (for Google Play Console)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RadhaNaam-play-AAB
          path: dist/RadhaNaamJap-play.aab
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload full APK (sideload / testing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RadhaNaam-full-APK
          path: dist/RadhaNaamJap-full.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn

      - name: Save bumped version counter
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .app-version
          git commit -m "Bump app version" || true
          git push || true
