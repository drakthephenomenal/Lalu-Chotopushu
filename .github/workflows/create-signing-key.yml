name: Create signing key (run ONCE)
on:
  workflow_dispatch:

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Generate upload keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore release.keystore -alias radhanaam \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=RadhaNaam SudhaRasam, O=RadhaNaam, C=IN"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=radhanaam\nstoreFile=release.keystore\n' "$PASS" "$PASS" > keystore.properties
      - name: Upload keystore files (download within 1 day, then delete this artifact)
        uses: actions/upload-artifact@v4
        with:
          name: signing-files
          path: |
            release.keystore
            keystore.properties
          retention-days: 1
