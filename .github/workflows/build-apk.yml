name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: bash build-android.sh
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(cat .app-version | tr -d '\r\n ')
          cp android/app/build/outputs/apk/release/app-release.apk RadhaNaamJap.apk
          gh release create "v1.0.${VER}" RadhaNaamJap.apk --draft --title "RadhaNaamJap v1.0.${VER}" --notes ""
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .app-version
          git commit -m "Bump app version" || true
          git push || true
