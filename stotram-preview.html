<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stotram Viewer — v89 Preview</title>
<style>
/* ── Google Fonts ── */
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

/* ══════════════════════════════════════════════════
   BASE RESET
══════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; width: 100%;
  background: #030a14;
  font-family: 'Hind Siliguri', serif;
  overflow: hidden;
}

/* ══════════════════════════════════════════════════
   DEMO SHELL — picker screen
══════════════════════════════════════════════════ */
#picker {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 20px 16px 24px;
  background: #030a14;
  overflow-y: auto;
  gap: 10px;
  z-index: 10;
}
#picker h1 {
  color: #ffd700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 4px;
  text-align: center;
}
#picker p {
  color: rgba(255,215,0,0.5);
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 10px;
  text-align: center;
}
.pick-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  width: 100%;
  max-width: 500px;
}
.pick-btn {
  background: rgba(255,215,0,0.07);
  border: 1px solid rgba(255,215,0,0.3);
  border-radius: 12px;
  padding: 11px 10px;
  color: #ffd700;
  font-family: 'Hind Siliguri', serif;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  line-height: 1.4;
  display: flex; flex-direction: column; gap: 2px;
  transition: background 0.15s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.pick-btn:active { transform: scale(0.96); background: rgba(255,215,0,0.15); }
.pick-btn .pid  { font-size: 10px; opacity: 0.4; letter-spacing: 1px; }
.pick-btn .pnm  { font-size: 12px; font-weight: 600; }
.pick-btn .psub { font-size: 10px; opacity: 0.55; }

/* theme dot indicator */
.pick-btn::after {
  content: attr(data-theme-dot);
  display: block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-top: 6px;
}
.pick-btn[data-theme="radha"]::after   { background: #f5c842; }
.pick-btn[data-theme="yamuna"]::after  { background: #6899c8; }
.pick-btn[data-theme="vishnu"]::after  { background: #8860c8; }
.pick-btn[data-theme="shiva"]::after   { background: #a85050; }
.pick-btn[data-theme="hanuman"]::after { background: #f5a800; }


/* ══════════════════════════════════════════════════
   MODAL OVERLAY
══════════════════════════════════════════════════ */
#lmo {
  position: fixed; inset: 0;
  background: #030a14;
  z-index: 400;
  display: none;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
#lmo.show { display: flex; }

/* ── Full-screen card (frame image) ── */
.lm-water-card {
  position: absolute; inset: 0;
  background-repeat:   no-repeat;
  background-position: center center;
  background-size:     contain;
}

/* ── Close button ── */
.lmx {
  position: absolute;
  top: max(env(safe-area-inset-top, 0px), 6px);
  right: 6px;
  background: rgba(4,10,30,0.75);
  border: 1px solid rgba(255,215,0,0.5);
  border-radius: 50%;
  width: 30px; height: 30px;
  color: #ffd700; font-size: 12px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 20;
  font-family: 'Hind Siliguri', sans-serif;
}
.lmx:active { background: rgba(255,215,0,0.2); }

/* ── Translate toggle ── */
.lm-translate-wrap {
  position: absolute;
  top: max(env(safe-area-inset-top, 0px), 6px);
  right: 44px;
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
  padding: 4px 8px;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,215,0,0.35);
  border-radius: 999px;
  z-index: 20;
}
.lm-toggle-label { font-size: 11px; color: rgba(255,255,255,0.8); user-select: none; }
.lm-toggle-sw {
  position: relative; width: 36px; height: 22px;
  border-radius: 11px; background: rgba(255,255,255,0.18);
  border: 1.5px solid rgba(255,255,255,0.22);
  cursor: pointer; transition: background 0.25s;
}
.lm-toggle-sw.on { background: rgba(46,204,113,0.75); }
.lm-toggle-thumb {
  position: absolute; top: 3px; left: 3px;
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.35);
  transition: transform 0.25s;
}
.lm-toggle-sw.on .lm-toggle-thumb { transform: translateX(14px); }

/* ── Stotram title ── */
.lmt {
  position: absolute;
  left: 50%; transform: translateX(-50%);
  white-space: nowrap;
  font-family: 'Hind Siliguri', serif;
  font-size: 13px; font-weight: 700;
  color: rgba(255,215,0,0.97);
  letter-spacing: 1px;
  text-shadow: 0 2px 10px rgba(0,0,0,1);
  background: rgba(4,10,30,0.55);
  padding: 3px 12px;
  border-radius: 999px;
  border: 1px solid rgba(255,215,0,0.4);
  z-index: 20;
}

/* ── Nav dots ── */
.lm-dots {
  position: absolute;
  left: 50%; transform: translateX(-50%);
  display: flex; justify-content: center; gap: 6px;
  flex-wrap: wrap; z-index: 20;
}
.lm-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,0.20); cursor: pointer;
  transition: all 0.2s;
}
.lm-dot.active { background: rgba(255,215,0,0.85); transform: scale(1.4); }

/* ── Nav arrows ── */
.lm-nav {
  position: absolute;
  left: 50%; transform: translateX(-50%);
  display: flex; gap: 52px; z-index: 20;
}
.lm-nav-btn {
  border: none; background: transparent;
  color: rgba(255,215,0,0.90);
  font-size: 28px; padding: 6px 16px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  cursor: pointer; transition: opacity 0.15s, transform 0.15s;
}
.lm-nav-btn:active { transform: scale(0.85); }
.lm-nav-btn:disabled { opacity: 0.20; cursor: default; }

/* ════════════════════════════════════════════════════════════════
   LYRICS SCROLL AREA  —  v89 positioning
════════════════════════════════════════════════════════════════ */

/* Standard frame 1023×1537  aspect 0.6656
   Tall   frame  578×1280   aspect 0.4516  (used below 9/20) */

/* Tallest Android — tall frame, width-scaled */
@media (max-aspect-ratio: 9/20) {
  .lm-card-inner {
    top:    calc(50dvh - 84.1vw);
    bottom: calc(50dvh - 88.6vw);
    left:   2vw; right: 2vw;
  }
  .lmt  { top: calc(50dvh - 95vw); }
  .lm-nav  { bottom: calc(50dvh - 89.5vw); }
  .lm-dots { bottom: calc(50dvh - 87.5vw); }
}

/* Standard portrait phones (9/20 ≤ aspect < 2/3) — std frame, width-scaled */
@media (min-aspect-ratio: 9/20) and (max-aspect-ratio: 2/3) {
  .lm-card-inner {
    top:    calc(50dvh - 58.6vw);
    bottom: calc(50dvh - 57.1vw);
    left:   2vw; right: 2vw;
  }
  .lmt  { top: calc(50dvh - 67vw); }
  .lm-nav  { bottom: calc(50dvh - 58.5vw); }
  .lm-dots { bottom: calc(50dvh - 56vw);   }
}

/* iPad / wide (aspect ≥ 2/3) — std frame, height-scaled */
@media (min-aspect-ratio: 2/3) {
  .lm-card-inner {
    top:    11dvh;
    bottom: 12dvh;
    left:   calc(50vw - 31.94dvh);
    right:  calc(50vw - 31.94dvh);
  }
  .lmt  { top: 7dvh; }
  .lm-nav  { bottom: 11.5dvh; }
  .lm-dots { bottom: 13.5dvh; }
}

/* ════════════════════════════════════════════════════════════════
   INNER CARD
════════════════════════════════════════════════════════════════ */
.lm-card-inner {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  touch-action: pan-y;
  padding: 14px 10px 10px;
  border-radius: 18px;
  box-shadow:
    inset 0 0 0 1.5px rgba(255,215,0,0.55),
    inset 0 0 24px  rgba(255,215,0,0.12),
    0     0  18px   rgba(0,0,0,0.45);
  z-index: 2;
  isolation: isolate;
}
.lm-card-inner::-webkit-scrollbar { width: 2px; }
.lm-card-inner::-webkit-scrollbar-track { background: transparent; }
.lm-card-inner::-webkit-scrollbar-thumb { background: rgba(100,55,0,0.3); border-radius: 4px; }

/* ════════════════════════════════════════════════════════════════
   GOLDEN SHIMMER WAVE
════════════════════════════════════════════════════════════════ */
@keyframes goldenWave {
  0%   { transform: translateX(-110%) skewX(-12deg); opacity: 0;    }
  10%  { opacity: 0.55; }
  85%  { opacity: 0.40; }
  100% { transform: translateX(210%)  skewX(-12deg); opacity: 0;    }
}

.lm-card-inner::before {
  content: '';
  display: block;
  position: absolute;
  top: 0; left: 0;
  width: 55%; height: 100%;
  background: linear-gradient(
    105deg,
    transparent              0%,
    rgba(255,220,80,0)       20%,
    rgba(255,220,80,0.28)    45%,
    rgba(255,240,140,0.38)   50%,
    rgba(255,220,80,0.28)    55%,
    rgba(255,220,80,0)       80%,
    transparent             100%
  );
  pointer-events: none;
  z-index: 0;
  animation: goldenWave 4.2s cubic-bezier(0.45,0,0.55,1) infinite;
  will-change: transform;
}

/* ════════════════════════════════════════════════════════════════
   LYRICS TEXT
════════════════════════════════════════════════════════════════ */
.lyr {
  position: relative; z-index: 1;
  font-family: 'Hind Siliguri', serif;
  text-align: center;
  width: 100%;
  display: flex; flex-direction: column; align-items: center;
  flex-shrink: 0;
  margin: auto;
}
.lyr-line {
  display: block;
  white-space: normal; overflow-wrap: break-word; word-break: break-word;
  font-size: clamp(13px, 4vw, 22px);
  line-height: 1.85;
  width: 100%; text-align: center;
}
.lyr-artha {
  font-style: italic;
  margin: 3px 0; text-align: center;
  white-space: normal; overflow-wrap: break-word; word-break: break-word;
  font-size: clamp(11px, 3.2vw, 16px);
}
.lyr-line-empty { display: block; height: 0.45em; width: 100%; }
.lyr-footer {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; padding: 10px 0 2px; width: 100%;
  opacity: 0.45; font-size: 14px; letter-spacing: 5px;
  user-select: none; flex-shrink: 0;
}

/* ════════════════════════════════════════════════════════════════
   PER-THEME COLOURS
════════════════════════════════════════════════════════════════ */
/* RADHA */
.lm-water-card[data-theme="radha"] .lm-card-inner {
  background: radial-gradient(ellipse at 50% 30%,
    #fff8e7 0%, #f5d97a 35%, #e8b94a 70%, #c89030 100%);
}
.lm-water-card[data-theme="radha"] .lyr-line   { color: #2b0f00; }
.lm-water-card[data-theme="radha"] .lyr-artha  { color: #6b1a00; }
.lm-water-card[data-theme="radha"] .lyr-footer { color: #7a4000; }
.lm-water-card[data-theme="radha"] .lm-card-inner::before {
  background: linear-gradient(105deg,
    transparent 0%, rgba(255,255,200,0) 20%,
    rgba(255,255,180,0.38) 50%,
    rgba(255,255,200,0) 80%, transparent 100%);
}

/* YAMUNA */
.lm-water-card[data-theme="yamuna"] .lm-card-inner {
  background: radial-gradient(ellipse at 50% 30%,
    #ddeeff 0%, #a8c8e8 35%, #6899c8 70%, #3a5f96 100%);
}
.lm-water-card[data-theme="yamuna"] .lyr-line   { color: #0a1a33; }
.lm-water-card[data-theme="yamuna"] .lyr-artha  { color: #0d2d55; }
.lm-water-card[data-theme="yamuna"] .lyr-footer { color: #1a3a60; }
.lm-water-card[data-theme="yamuna"] .lm-card-inner::before {
  background: linear-gradient(105deg,
    transparent 0%, rgba(180,220,255,0) 20%,
    rgba(180,230,255,0.42) 50%,
    rgba(180,220,255,0) 80%, transparent 100%);
}

/* VISHNU */
.lm-water-card[data-theme="vishnu"] .lm-card-inner {
  background: radial-gradient(ellipse at 50% 30%,
    #ede8f8 0%, #c0a8e8 35%, #8860c8 70%, #4a2a80 100%);
}
.lm-water-card[data-theme="vishnu"] .lyr-line   { color: #15052e; }
.lm-water-card[data-theme="vishnu"] .lyr-artha  { color: #2a0a50; }
.lm-water-card[data-theme="vishnu"] .lyr-footer { color: #3a1060; }
.lm-water-card[data-theme="vishnu"] .lm-card-inner::before {
  background: linear-gradient(105deg,
    transparent 0%, rgba(210,190,255,0) 20%,
    rgba(220,200,255,0.38) 50%,
    rgba(210,190,255,0) 80%, transparent 100%);
}

/* SHIVA */
.lm-water-card[data-theme="shiva"] .lm-card-inner {
  background: radial-gradient(ellipse at 50% 30%,
    #f5e8e8 0%, #d4a0a0 35%, #a85050 70%, #5a1a1a 100%);
}
.lm-water-card[data-theme="shiva"] .lyr-line   { color: #1a0505; }
.lm-water-card[data-theme="shiva"] .lyr-artha  { color: #4a0808; }
.lm-water-card[data-theme="shiva"] .lyr-footer { color: #6a1010; }
.lm-water-card[data-theme="shiva"] .lm-card-inner::before {
  background: linear-gradient(105deg,
    transparent 0%, rgba(255,200,200,0) 20%,
    rgba(255,210,210,0.36) 50%,
    rgba(255,200,200,0) 80%, transparent 100%);
}

/* HANUMAN */
.lm-water-card[data-theme="hanuman"] .lm-card-inner {
  background: radial-gradient(ellipse at 50% 30%,
    #fff3cc 0%, #f5a800 40%, #c86400 75%, #7a2a00 100%);
}
.lm-water-card[data-theme="hanuman"] .lyr-line   { color: #1a0800; }
.lm-water-card[data-theme="hanuman"] .lyr-artha  { color: #5a1500; }
.lm-water-card[data-theme="hanuman"] .lyr-footer { color: #7a2800; }
.lm-water-card[data-theme="hanuman"] .lm-card-inner::before {
  background: linear-gradient(105deg,
    transparent 0%, rgba(255,220,100,0) 20%,
    rgba(255,235,120,0.44) 50%,
    rgba(255,220,100,0) 80%, transparent 100%);
}

/* Fallback */
.lm-water-card:not([data-theme]) .lm-card-inner {
  background: radial-gradient(ellipse at 50% 30%,
    #fff8e7 0%, #f5d97a 35%, #e8b94a 70%, #c89030 100%);
}
</style>
</head>
<body>

<!-- ══ PICKER SCREEN ════════════════════════════════════════════════ -->
<div id="picker">
  <h1>🪷 স্তোত্রম্ দর্শন</h1>
  <p>Select a stotram to preview</p>
  <div class="pick-grid" id="pickGrid"></div>
</div>

<!-- ══ MODAL ════════════════════════════════════════════════════════ -->
<div id="lmo">
  <div class="lm-water-card" id="lmCard">

    <!-- Close -->
    <button class="lmx" id="lmClose" aria-label="Close">✕</button>

    <!-- Translate toggle -->
    <div class="lm-translate-wrap" id="transWrap">
      <span class="lm-toggle-label">অর্থ</span>
      <button class="lm-toggle-sw" id="transSw" aria-label="Toggle translation">
        <span class="lm-toggle-thumb"></span>
      </button>
    </div>

    <!-- Title -->
    <div class="lmt" id="lmTitle">স্তোত্রম্</div>

    <!-- Lyrics scroll area -->
    <div class="lm-card-inner" id="lmInner">
      <div class="lyr" id="lmLyr"></div>
    </div>

    <!-- Dots -->
    <div class="lm-dots" id="lmDots"></div>

    <!-- Nav -->
    <div class="lm-nav">
      <button class="lm-nav-btn" id="lmPrev" aria-label="Previous">‹</button>
      <button class="lm-nav-btn" id="lmNext" aria-label="Next">›</button>
    </div>

  </div><!-- .lm-water-card -->
</div><!-- #lmo -->

<script>
/* ═══════════════════════════════════════════════════════════
   DATA
═══════════════════════════════════════════════════════════ */

  {id:'ans', name:'অর্ধনারীশ্বরস্তোত্রম্',        sub:'শিব-পার্বতীর স্তোত্র'},
  {id:'rds', name:'রুদ্রাষ্টকম্',                sub:'রুদ্রের অষ্টক স্তোত্র'},
  {id:'sps', name:'শ্রী শিব পঞ্চাক্ষর স্তোত্রম্',sub:'পঞ্চাক্ষর মন্ত্রের স্তোত্র'},
  {id:'hnc', name:'শ্রী হনুমান চালীসা',           sub:'গোস্বামী তুলসীদাস'}

/* Sample verses per stotram (short excerpts for demo) */
const SAMPLE = {

/* Frame background — use the amber+navy frame colour approximation */
const FRAME_BG = {
  radha:   '#0a1428',
  yamuna:  '#061220',
  vishnu:  '#0c0820',
  shiva:   '#0f0505',
  hanuman: '#0f0800'
};

/* ═══════════════════════════════════════════════════════════
   BUILD PICKER
═══════════════════════════════════════════════════════════ */
const grid = document.getElementById('pickGrid');
STLIST.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'pick-btn';
  btn.dataset.theme = STOTRAM_THEME[s.id] || 'radha';
  btn.innerHTML = `
    <span class="pid">${s.id.toUpperCase()}</span>
    <span class="pnm">${s.name}</span>
    <span class="psub">${s.sub}</span>`;
  btn.addEventListener('click', () => openStotram(s.id, s.name));
  grid.appendChild(btn);
});

/* ═══════════════════════════════════════════════════════════
   MODAL LOGIC
═══════════════════════════════════════════════════════════ */
let curVerses = [], curIdx = 0, showTrans = false;

function openStotram(id, name) {
  const theme = STOTRAM_THEME[id] || 'radha';
  const card  = document.getElementById('lmCard');
  card.dataset.theme = theme;
  card.style.background = FRAME_BG[theme] || '#0a1428';

  document.getElementById('lmTitle').textContent = name;

  curVerses = SAMPLE[id] || ['(লিরিক্স লোড হচ্ছে…)'];
  curIdx    = 0;
  showTrans = false;
  document.getElementById('transSw').classList.remove('on');

  renderVerse();
  buildDots();

  document.getElementById('lmo').classList.add('show');
  document.getElementById('picker').style.display = 'none';
}

function closeModal() {
  document.getElementById('lmo').classList.remove('show');
  document.getElementById('picker').style.display = '';
}

function renderVerse() {
  const lyr = document.getElementById('lmLyr');
  const txt = curVerses[curIdx] || '';
  lyr.innerHTML = '';
  txt.split('\n').forEach((line, i, arr) => {
    if (!line.trim()) {
      const emp = document.createElement('span');
      emp.className = 'lyr-line-empty';
      lyr.appendChild(emp);
    } else {
      const sp = document.createElement('span');
      sp.className = 'lyr-line';
      sp.textContent = line;
      lyr.appendChild(sp);
    }
  });
  const foot = document.createElement('div');
  foot.className = 'lyr-footer';
  foot.textContent = `· · ·`;
  lyr.appendChild(foot);

  // scroll to top
  const inner = document.getElementById('lmInner');
  inner.scrollTop = 0;

  // update nav
  document.getElementById('lmPrev').disabled = curIdx === 0;
  document.getElementById('lmNext').disabled = curIdx === curVerses.length - 1;

  // update dots
  document.querySelectorAll('.lm-dot').forEach((d, i) => {
    d.classList.toggle('active', i === curIdx);
  });
}

function buildDots() {
  const dots = document.getElementById('lmDots');
  dots.innerHTML = '';
  curVerses.forEach((_, i) => {
    const d = document.createElement('span');
    d.className = 'lm-dot' + (i === 0 ? ' active' : '');
    d.addEventListener('click', () => { curIdx = i; renderVerse(); });
    dots.appendChild(d);
  });
}

document.getElementById('lmClose').addEventListener('click', closeModal);

document.getElementById('lmPrev').addEventListener('click', () => {
  if (curIdx > 0) { curIdx--; renderVerse(); }
});
document.getElementById('lmNext').addEventListener('click', () => {
  if (curIdx < curVerses.length - 1) { curIdx++; renderVerse(); }
});

document.getElementById('transSw').addEventListener('click', function() {
  showTrans = !showTrans;
  this.classList.toggle('on', showTrans);
});

/* Swipe support */
let touchX = 0;
const inner = document.getElementById('lmInner');
inner.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, {passive:true});
inner.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 55) {
    if (dx < 0 && curIdx < curVerses.length - 1) { curIdx++; renderVerse(); }
    else if (dx > 0 && curIdx > 0) { curIdx--; renderVerse(); }
  }
}, {passive:true});
</script>
