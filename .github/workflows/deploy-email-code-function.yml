name: Deploy email sign-in code function

on:
  workflow_dispatch:
  push:
    paths:
      - "functions/emailCode.js"
      - ".github/workflows/deploy-email-code-function.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function dependencies
        run: cd functions && npm install

      - name: Write function environment
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
        run: |
          if [ -z "$MAIL_USER" ] || [ -z "$MAIL_APP_PASSWORD" ]; then
            echo "Add GitHub secrets MAIL_USER and MAIL_APP_PASSWORD first."; exit 1
          fi
          {
            printf 'MAIL_USER=%s\n' "$MAIL_USER"
            printf 'MAIL_APP_PASSWORD=%s\n' "$(printf '%s' "$MAIL_APP_PASSWORD" | tr -d ' ')"
            if [ ! -f functions/.env.guru-kripahi-kevalam-108 ]; then
              printf 'ZOHO_CLIENT_ID=unused\nZOHO_REDIRECT_URI=unused\nDRIVE_CLIENT_ID=unused\n'
            fi
          } > functions/.env

      - name: Write service-account key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"

      - name: Deploy emailCode
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx firebase-tools deploy --only functions:emailCode --project guru-kripahi-kevalam-108 --non-interactive --force
