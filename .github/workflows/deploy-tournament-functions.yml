name: Deploy tournament functions

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function dependencies
        run: cd functions && npm install

      # The tournament functions do not use the Zoho / Drive parameters.
      # Placeholders are written only if the committed env file is missing.
      - name: Placeholder params if env file is missing
        run: |
          if [ ! -f functions/.env.guru-kripahi-kevalam-108 ]; then
            printf 'ZOHO_CLIENT_ID=unused\nZOHO_REDIRECT_URI=unused\nDRIVE_CLIENT_ID=unused\n' > functions/.env
          fi

      - name: Write service-account key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"

      - name: Deploy joinTournament, submitTournamentTaps and finalizeTournament
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx firebase-tools deploy --only functions:joinTournament,functions:submitTournamentTaps,functions:finalizeTournament --project guru-kripahi-kevalam-108 --non-interactive --force
