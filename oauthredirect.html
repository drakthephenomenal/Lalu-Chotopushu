<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing you in</title>
<style>
  body { font-family: sans-serif; text-align: center; margin-top: 80px; }
  a.btn {
    display: inline-block; padding: 16px 32px; font-size: 18px;
    background: #E56B1F; color: white; border-radius: 8px;
    text-decoration: none; margin-top: 20px;
  }
</style>
</head>
<body>
<p>Sign-in successful.</p>
<a class="btn" id="continueBtn" href="#">Tap to return to app</a>
<script>
  var params = window.location.search + window.location.hash;
  var target = "app.vercel.radharadharadha.capacitor://oauthredirect" + params;
  document.getElementById("continueBtn").href = target;
  // Also try an automatic bounce shortly after load, in case this browser allows it
  setTimeout(function () { window.location.href = target; }, 300);
</script>
</body>
</html>
