name: Update Favourite Videos manifest

# Runs whenever anything changes under videos/ (upload, rename, delete)
# — EXCEPT videos/manifest.json itself, so the commit this workflow makes
# doesn't re-trigger itself in a loop.
on:
  push:
    branches: [main]
    paths:
      - 'videos/**'
      - '!videos/manifest.json'
  # Lets you manually re-run this from the Actions tab (e.g. right after
  # adding this workflow, to pick up videos uploaded before it existed).
  workflow_dispatch:

# Needed so the workflow can commit videos/manifest.json back to the repo.
# If this step fails with a permissions error, go to:
#   Settings → Actions → General → Workflow permissions
# and switch it to "Read and write permissions", then re-run.
permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate videos/manifest.json
        run: |
          python3 - <<'EOF'
          import json, os

          # Keep this list in sync with VIDEO_SUBFOLDERS in app.js.
          folders = ["motivation", "naam-jap-mahima", "law-of-karma"]
          exts = (".mp4", ".webm", ".mov", ".m4v")
          manifest = {}

          for folder in folders:
              path = os.path.join("videos", folder)
              files = []
              if os.path.isdir(path):
                  files = sorted(
                      f for f in os.listdir(path)
                      if f.lower().endswith(exts)
                  )
              manifest[folder] = files

          os.makedirs("videos", exist_ok=True)
          with open("videos/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          EOF

      - name: Commit manifest if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos/manifest.json
          git diff --cached --quiet || git commit -m "Auto-update videos/manifest.json"
          git push
