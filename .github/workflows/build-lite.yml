name: 1 - Build LITE (AAB + APK, under 100 MB)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Add swap (stops Gradle being killed for low memory)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || true
          free -m

      - name: Check version counter and conflict markers
        run: |
          grep -qE '^[0-9]+$' .app-version || { echo "::error::.app-version is not a plain number"; cat .app-version; exit 1; }
          if grep -rIlE '^(<<<<<<<|>>>>>>>) ' --include=*.js --include=*.html --include=*.json --include=*.sh --include=*.yml . 2>/dev/null | grep -v node_modules; then
            echo "::error::Git conflict markers left in the files above"; exit 1
          fi

      - run: npm install

      - name: Build LITE (signed AAB + APK)
        run: bash build-apk-lite.sh

      - name: Sizes and biggest files
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB_MB=$(( $(stat -c%s "$AAB") / 1024 / 1024 ))
          APK_MB=$(( $(stat -c%s "$APK") / 1024 / 1024 ))
          {
            echo "### LITE  AAB: ${AAB_MB} MB   APK: ${APK_MB} MB"
            echo "Biggest files inside the AAB:"
            echo '```'
            unzip -v "$AAB" | sort -k3 -n -r | head -15 | awk '{printf "%7.1f MB  %s\n", $3/1048576, $NF}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$APK_MB" -gt 100 ] && echo "::warning::Lite APK is ${APK_MB} MB (target 100 MB)"
          true

      - name: Upload AAB (for Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: RadhaNaam-LITE-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error

      - name: Upload APK (install on phone)
        uses: actions/upload-artifact@v4
        with:
          name: RadhaNaam-LITE-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Save bumped version counter
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .app-version
          git commit -m "Bump app version" || true
          git push || true
