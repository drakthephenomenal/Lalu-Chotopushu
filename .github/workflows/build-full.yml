name: 2 - Build FULL (AAB + APK, all audio + video)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free up disk space (media is several GB and is copied a few times)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost \
                      /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Add swap (stops Gradle being killed for low memory)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || true
          free -m

      - name: Check version counter and conflict markers
        run: |
          grep -qE '^[0-9]+$' .app-version || { echo "::error::.app-version is not a plain number"; cat .app-version; exit 1; }
          if grep -rIlE '^(<<<<<<<|>>>>>>>) ' --include=*.js --include=*.html --include=*.json --include=*.sh --include=*.yml . 2>/dev/null | grep -v node_modules; then
            echo "::error::Git conflict markers left in the files above"; exit 1
          fi

      - run: npm install

      - name: Build FULL (Play AAB with asset packs + APK with everything inside)
        run: bash build-full.sh

      - name: Sizes
        if: always()
        run: |
          ls -lh dist/ || true
          {
            echo "### FULL build"
            for f in dist/*; do [ -f "$f" ] && echo "- $(basename "$f"): $(( $(stat -c%s "$f") / 1024 / 1024 )) MB"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB (for Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: RadhaNaam-FULL-aab
          path: dist/RadhaNaamJap-full.aab
          compression-level: 0
          retention-days: 5
          if-no-files-found: error

      - name: Upload APK (install on phone)
        uses: actions/upload-artifact@v4
        with:
          name: RadhaNaam-FULL-apk
          path: dist/RadhaNaamJap-full.apk
          compression-level: 0
          retention-days: 5
          if-no-files-found: error

      - name: Save bumped version counter
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .app-version
          git commit -m "Bump app version" || true
          git push || true
