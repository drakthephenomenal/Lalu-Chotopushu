  <div id="vpanchanga-view" style="display:none;padding-bottom:24px">

    <!-- Header -->
    <div class="vp-head">
      <div class="vp-gaurabda" id="vp-gaurabda"></div>
      <div class="vp-loc-row">
        <span class="vp-loc-dot"></span>
        <span id="vp-loc-text">Locating…</span>
      </div>
    </div>

    <!-- Clock -->
    <div class="vp-clock-wrap">
      <div class="vp-om-bg">ॐ</div>
      <div id="vp-clock"></div>
    </div>
    <div id="vp-vaar-name"></div>
    <div id="vp-month-line"></div>
    <div id="vp-vaishnav-line"></div>

    <!-- ORBITAL DIAL — planetary view of the week, today at center -->
    <div class="vp-orbit-wrap" id="vp-orbit-wrap">
      <div class="vp-orbit-ring"></div>
      <div class="vp-orbit-center" id="vp-orbit-center">
        <div class="vp-orbit-center-icon" id="vp-orbit-center-icon"></div>
        <div class="vp-orbit-center-label" id="vp-orbit-center-label"></div>
        <div class="vp-orbit-center-sub" id="vp-orbit-center-sub"></div>
      </div>
      <!-- 7 orbit buttons injected by JS with computed positions -->
    </div>

    <!-- Viewing bar for selected vaar -->
    <div id="vp-viewing-bar" style="display:none">
      <span class="vp-viewing-chip" id="vp-viewing-label"></span>
      <button class="vp-back-btn" onclick="vpClearSelectedVaar()">← Back to today</button>
    </div>

    <!-- NOW PANEL -->
    <div class="vp-now-panel" id="vp-now-panel">
      <div class="vp-now-panel-head">
        <div class="vp-pulse"></div>
        <span id="vp-now-panel-title">Right Now &amp; Coming Soon</span>
      </div>
      <div class="vp-now-grid" id="vp-now-grid"></div>
    </div>

    <!-- Tithi grid toggle -->
    <button class="vp-tithi-toggle" id="vp-tithi-toggle" onclick="vpToggleGrid()">
      <span>🌙 &nbsp;Lunar Month — All 30 Tithis</span>
      <span class="vp-chevron" id="vp-chevron">▾</span>
    </button>
    <div class="vp-month-grid-wrap" id="vp-month-grid-wrap">
      <div class="vp-month-grid" id="vp-month-grid"></div>
    </div>

    <!-- PANCHANGA ANGAS — option-driven tabs, one focused panel -->
    <section class="vp-anga-section">
      <div class="vp-sec-head">Panchanga Angas</div>
      <div class="vp-anga-tabs" id="vp-anga-tabs"></div>
      <div class="vp-anga-panel" id="vp-anga-panel"></div>
    </section>

    <section class="vp-m-section">
      <div class="vp-sec-head vp-sec-head-green">Auspicious Periods</div>
      <div class="vp-space-y" id="vp-ausp-rows"></div>
    </section>

    <section class="vp-m-section">
      <div class="vp-sec-head vp-sec-head-red">Inauspicious Periods</div>
      <div class="vp-space-y" id="vp-inaup-rows"></div>
    </section>

    <div id="vp-special-yoga-sec" style="display:none">
      <section class="vp-m-section">
        <div class="vp-sec-head" style="color:var(--vp-gold)">Special Yogas</div>
        <div class="vp-space-y" id="vp-yoga-cards"></div>
      </section>
    </div>

    <section class="vp-db-section">
      <div class="vp-sec-head">Day Boundaries</div>
      <div class="vp-db-grid" id="vp-db-grid"></div>
    </section>

  </div>
