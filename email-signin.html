<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sign in – RadhaNaam SudhaRasam</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#0b1022;color:#eef1ff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .card{width:100%;max-width:440px;background:linear-gradient(180deg,#171e42,#0d1227);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  h1{margin:0 0 6px;font-size:20px;color:#ffd97a}
  p{margin:8px 0;font-size:14px;line-height:1.55;color:#cfd6f5}
  .code{font-size:42px;letter-spacing:10px;font-weight:700;color:#ffd97a;background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.25);border-radius:14px;padding:14px 8px 14px 18px;margin:16px 0 6px}
  .small{font-size:12px;opacity:.8}
  button,a.btn{display:block;width:100%;margin-top:10px;padding:13px;border-radius:12px;font:600 14.5px Inter,Arial,sans-serif;cursor:pointer;text-decoration:none;text-align:center}
  .gold{border:1px solid rgba(255,215,0,.5);background:rgba(255,215,0,.16);color:#ffd97a}
  .ghost{border:1px solid rgba(255,255,255,.22);background:transparent;color:#cfe2ff}
  .err{color:#ff8a8a}
  .sep{border-top:1px solid rgba(255,255,255,.1);margin:18px 0 6px}
</style>
</head>
<body>
<div class="card" id="card"><p>Loading…</p></div>
<script>
(function () {
  var API = "https://us-central1-guru-kripahi-kevalam-108.cloudfunctions.net/emailCode";
  var card = document.getElementById("card");
  var q = new URLSearchParams(location.search);
  var token = q.get("rjlink") || "", email = (q.get("rje") || "").trim().toLowerCase();

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function call(body) {
    return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || "Something went wrong."); e.code = j.code; throw e; } return j; }); });
  }
  function showError(msg) {
    card.textContent = "";
    card.appendChild(el("h1", "", "Sign-in problem"));
    card.appendChild(el("p", "err", msg));
    card.appendChild(el("p", "small", "Go back to the app and request a new email."));
  }
  function appLink(extra) { return "/?rjlink=" + encodeURIComponent(token) + "&rje=" + encodeURIComponent(email) + (extra || ""); }

  if (!token || !email) { showError("This link is not valid."); return; }

  // Same browser that started the sign-in (web version): let the app finish the sign-in directly.
  try {
    var pend = JSON.parse(localStorage.getItem("rj_otp_pending") || "null");
    if (pend && pend.email === email && Date.now() - (pend.ts || 0) < 15 * 60 * 1000) { location.replace(appLink("")); return; }
  } catch (_) {}

  // Different device / app: show the code straight away.
  call({ action: "peek", email: email, token: token }).then(function (j) {
    card.textContent = "";
    card.appendChild(el("h1", "", "\uD83D\uDD10 Your sign-in code"));
    card.appendChild(el("p", "", "Type this code in the app where you are signing in:"));
    card.appendChild(el("div", "code", j.code));
    var copy = el("button", "ghost", "\uD83D\uDCCB Copy code");
    copy.onclick = function () {
      var done = function () { copy.textContent = "\u2705 Copied"; setTimeout(function () { copy.textContent = "\uD83D\uDCCB Copy code"; }, 2000); };
      var fallback = function () {
        try {
          var t = document.createElement("textarea"); t.value = j.code; t.setAttribute("readonly", "");
          t.style.cssText = "position:fixed;opacity:0;top:0;left:0"; document.body.appendChild(t); t.select();
          var ok = document.execCommand("copy"); document.body.removeChild(t);
          if (ok) done(); else copy.textContent = "Press and hold the code to copy";
        } catch (_) { copy.textContent = "Press and hold the code to copy"; }
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(j.code).then(done, fallback); else fallback();
    };
    card.appendChild(copy);
    card.appendChild(el("p", "small", "Valid for 10 minutes. Only use it if you just asked to sign in."));

    card.appendChild(el("div", "sep"));
    card.appendChild(el("p", "small", "Or let the app sign in by itself (tap only if you just tried to sign in):"));
    var auto = el("button", "gold", "Sign in my app automatically");
    auto.onclick = function () {
      auto.disabled = true; auto.textContent = "Please wait…";
      call({ action: "approve", email: email, token: token }).then(function () {
        auto.textContent = "\u2705 Approved \u2013 go back to the app and refresh";
        var note = el("p", "small", "Open the app again and refresh it (pull down, or close and reopen). It will sign in within a few seconds. If it does not, type the code above.");
        auto.parentNode.insertBefore(note, auto.nextSibling);
      }).catch(function (e) { auto.disabled = false; auto.textContent = "Sign in my app automatically"; alert(e.message || "Could not approve."); });
    };
    card.appendChild(auto);
    var here = el("a", "btn ghost", "Sign in on this browser instead");
    here.href = appLink("&rjhere=1");
    card.appendChild(here);
  }).catch(function (e) { showError(e.message || "This link is no longer valid."); });
})();
</script>
</body>
</html>
