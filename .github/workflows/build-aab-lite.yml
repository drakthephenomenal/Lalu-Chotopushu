name: Build AAB (Lite - Google Play)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Add swap (stops Gradle being killed for low memory)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || true
          free -m
      - run: npm install
      - name: Build lite release (APK for testing + AAB for Play)
        run: bash build-apk-lite.sh
      - name: Show AAB size
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          TOTAL=$(( $(stat -c%s "$AAB") / 1024 / 1024 ))
          BASE=$(unzip -v "$AAB" | awk '$NF ~ /^base\// {s+=$3} END {print int(s/1024/1024)}')
          echo "Lite AAB total: ${TOTAL} MB | base module: ~${BASE} MB"
          {
            echo "### Lite AAB total: ${TOTAL} MB"
            echo "- base module: ~${BASE} MB (Play limit about 200 MB)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BASE" -gt 180 ]; then
            echo "::warning::Base module is ~${BASE} MB. Play's limit is about 200 MB."
          fi
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: RadhaNaam-lite-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
      - name: Upload lite APK (for testing on a phone)
        uses: actions/upload-artifact@v4
        with:
          name: RadhaNaam-lite-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
      - name: Save bumped version counter
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .app-version
          git commit -m "Bump app version" || true
          git push || true
