name: Build APK (Lite, under 100 MB)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Build lite APK
        run: bash build-apk-lite.sh
      - name: Show APK size
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          MB=$(( $(stat -c%s "$APK") / 1024 / 1024 ))
          echo "Lite APK: ${MB} MB"
          echo "### Lite APK: ${MB} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MB" -gt 100 ]; then
            echo "::warning::Lite APK is ${MB} MB - over the 100 MB target."
          fi
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(cat .app-version | tr -d '\r\n ')
          cp android/app/build/outputs/apk/release/app-release.apk RadhaNaamJap-Lite.apk
          gh release create "lite-v1.0.${VER}" RadhaNaamJap-Lite.apk --draft --title "RadhaNaamJap LITE v1.0.${VER}" --notes ""
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .app-version
          git commit -m "Bump app version" || true
          git push || true
