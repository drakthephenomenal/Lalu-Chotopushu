name: Build Lite (APK + AAB)
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also create a draft GitHub release with the APK"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Add swap (stops Gradle being killed for low memory)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || true
          free -m
      - run: npm install
      - name: Build lite release (APK for testing + AAB for Play)
        run: bash build-apk-lite.sh
      - name: Show sizes
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          APK_MB=$(( $(stat -c%s "$APK") / 1024 / 1024 ))
          AAB_MB=$(( $(stat -c%s "$AAB") / 1024 / 1024 ))
          BASE=$(unzip -v "$AAB" | awk '$NF ~ /^base\// {s+=$3} END {print int(s/1024/1024)}')
          echo "Lite APK: ${APK_MB} MB | Lite AAB: ${AAB_MB} MB (base module ~${BASE} MB)"
          {
            echo "### Lite APK: ${APK_MB} MB"
            echo "### Lite AAB: ${AAB_MB} MB"
            echo "- base module: ~${BASE} MB (Play limit about 200 MB)"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$APK_MB" -gt 100 ] && echo "::warning::Lite APK is ${APK_MB} MB - over the 100 MB target."
          [ "$BASE" -gt 180 ] && echo "::warning::Base module is ~${BASE} MB. Play's limit is about 200 MB."
          true
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: RadhaNaam-lite-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
      - name: Upload lite APK (for testing on a phone)
        uses: actions/upload-artifact@v4
        with:
          name: RadhaNaam-lite-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
      - name: Draft GitHub release (APK)
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(cat .app-version | tr -d '\r\n ')
          cp android/app/build/outputs/apk/release/app-release.apk RadhaNaamJap-Lite.apk
          gh release create "lite-v1.0.${VER}" RadhaNaamJap-Lite.apk --draft --title "RadhaNaamJap LITE v1.0.${VER}" --notes ""
      - name: Save bumped version counter
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .app-version
          git commit -m "Bump app version" || true
          git push || true
